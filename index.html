const { unseal, deriveAlpha, applyK, kFromNpyB64 } = globalThis.ECM;

const logEl = document.getElementById('log');
const form = document.getElementById('promptForm');
const input = document.getElementById('line');
const label = document.getElementById('label');

function print(text, cls) {
  const div = document.createElement('div');
  div.className = 'row' + (cls ? ' ' + cls : '');
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}
function showBeta(beta) {
  const wrap = document.createElement('div');
  wrap.className = 'row beta';
  const field = document.createElement('input');
  field.type = 'text'; field.readOnly = true; field.value = beta; field.className = 'betafield';
  const copy = document.createElement('button');
  copy.type = 'button'; copy.textContent = 'copy'; copy.className = 'copybtn';
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(beta); copy.textContent = 'copied'; }
    catch { field.select(); document.execCommand && document.execCommand('copy'); copy.textContent = 'copied'; }
    setTimeout(() => (copy.textContent = 'copy'), 1200);
  };
  wrap.append(field, copy);
  logEl.appendChild(wrap);
  logEl.scrollTop = logEl.scrollHeight;
}

let state = 'password';
let plasma = null, K = null, shape = null;

function prompt() { input.value = ''; input.focus(); }

async function heavy(fn) {
  // yield a frame so "working..." paints before the ~0.7s scrypt blocks
  await new Promise((r) => setTimeout(r, 0));
  return fn();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const value = input.value;
  input.value = '';
  input.disabled = true;

  if (state === 'password') {
    const busy = print('…', 'dim');
    try {
      const src = await unseal(PAYLOAD, value);           // scrypt -> AES-GCM
      const k = /K_encoded = "([^"]*)"/.exec(src);
      const p = /plasma = "([^"]*)"/.exec(src);
      if (!k || !p) throw new Error('payload did not expose K / plasma');
      plasma = p[1];
      ({ K, shape } = kFromNpyB64(k[1]));
      busy.remove();
      state = 'helium';
      prompt();
    } catch (err) {
      busy.remove();
      print('×', 'err');               // never name what failed; re-ask
      prompt();
    }
  } else if (state === 'helium') {
    // never echo the helium
    const busy = print('…', 'dim');
    try {
      const alpha = await heavy(() => deriveAlpha(plasma, value, { log2n: 16, r: 8, p: 1 }));
      let beta = null;
      try { beta = applyK(alpha, K, shape[0], shape[1], true); }
      catch { beta = null; }
      busy.remove();
      if (beta === null) print('—', 'dim');
      else showBeta(beta);
    } catch (err) {
      busy.remove();
      print('×', 'err');
    }
    prompt();
  }
  input.disabled = false;
  input.focus();
});

prompt();
//__ECM_UI_END__
